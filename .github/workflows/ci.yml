name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# 取消同一分支上仍在跑的旧任务，避免堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端（ruff + pytest + compileall）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v5

      - name: 安装 Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt

      - name: 安装依赖（锁定版本）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt -r requirements-dev.txt

      - name: 代码检查（全仓）
        run: ruff check .

      - name: 运行测试
        # 测试全部使用 SQLite 内存库，因此不需要 MySQL 服务
        run: pytest tests -q

      - name: 语法编译检查
        run: python -m compileall -q app migrations tests

      - name: 校验迁移脚本
        # 只校验迁移链可解析且只有一个 head；比对真实表结构需要 MySQL，
        # 那一步留在本机执行（alembic check）
        run: alembic heads

  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与构建
        # npm run build = vue-tsc -b && vite build
        run: npm run build
